name: Cladwell
description: Cladwell is a smart-closet and outfit-planning consumer application that helps people
  build capsule wardrobes and get more wear out of the clothes they already own. The service digitizes
  a user's closet, then uses AI styling ("Ask Cladwell") together with weather and personal preferences
  to recommend daily outfits, reduce over-buying, and encourage sustainable, intentional dressing. With
  more than one million app downloads, Cladwell is delivered primarily as iOS/Android and web apps
  (app.cladwell.com) with a subscription model; it currently exposes no public developer API. Founded and
  led by CEO Erin Flynn, it was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network for enrichment tracking.
